# CI for GameArtManager (classic UWP C# app).
# Runs on every push and pull request targeting main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # Full history so gitleaks scans every commit, not just the checkout.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly (MIT-licensed). The gitleaks-action
      # wrapper requires a GITLEAKS_LICENSE for personal accounts; the binary
      # has no such restriction and scans every push/PR for leaked secrets.
      - name: Install gitleaks
        run: |
          V=8.24.3
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose

  build:
    # Pinned: windows-latest now ships VS 18, which dropped the managed-UWP
    # toolchain (the UAP 10.0.22621 platform SDK is absent and every
    # Windows.UI.Xaml.* type fails to resolve). windows-2022 = VS 2022 with
    # the UWP workload and matching Windows SDKs.
    runs-on: windows-2022
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild GameArtManager.sln -t:Restore -p:Configuration=Debug -p:Platform=x64 -m

      # Signing is disabled in CI: the signing key is developer-local and must
      # never live in the repo or CI. This build exists to validate compilation
      # of every push and PR; Debug|x64 exercises XAML + .NET compile without
      # the slow .NET Native Release path.
      - name: Build
        run: msbuild GameArtManager.sln -p:Configuration=Debug -p:Platform=x64 -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never -m
